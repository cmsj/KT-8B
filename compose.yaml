services:
  kt:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./config.json
        target: /config/config.json
        read_only: true
        bind:
          # Fail if config.json is missing, rather than Docker creating an empty directory in its place.
          create_host_path: false
      - kt-data:/data

volumes:
  kt-data:
